name: Publish Docker images
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            file: docker/server.Dockerfile
          - name: matterbridge
            file: docker/matterbridge.Dockerfile
          - name: updater
            file: docker/updater.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./server/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/qnaphomehub
          tags: |
            type=raw,value=${{ matrix.name }}
            type=raw,value=${{ matrix.name }}-${{ github.sha }}
            type=ref,event=tag,prefix=${{ matrix.name }}-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HOMEHUB_VERSION=${{ steps.version.outputs.version }}

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create stable GitHub Release after images are published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "QnapHomeHub $GITHUB_REF_NAME"
