name: Publish Docker images
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            file: docker/server.Dockerfile
          - name: matterbridge
            file: docker/matterbridge.Dockerfile
          - name: updater
            file: docker/updater.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./server/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${PACKAGE_VERSION}"
          fi
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/qnaphomehub
          tags: |
            type=raw,value=${{ matrix.name }}
            type=raw,value=${{ matrix.name }}-${{ github.sha }}
            type=raw,value=${{ matrix.name }}-${{ steps.version.outputs.release_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HOMEHUB_VERSION=${{ steps.version.outputs.version }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./server/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${PACKAGE_VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Create version tag when needed
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}"
          fi
      - name: Create or update stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" --verify-tag --generate-notes --title "QnapHomeHub ${TAG}"
          fi
