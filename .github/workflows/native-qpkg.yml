name: Native QPKG lightweight checks
on:
  pull_request:
    paths:
      - 'native/**'
      - 'qpkg/**'
      - 'tests/test_native_*.py'
      - 'scripts/build-native-qpkg.sh'
      - 'compose.low-io.yaml'
      - 'scripts/qnap-quiet-eval.sh'
      - 'docs/QUIET-MODE.md'
      - 'docs/NATIVE-QPKG.md'
      - '.github/workflows/native-qpkg.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'qpkg/**'
      - 'tests/test_native_*.py'
      - 'scripts/build-native-qpkg.sh'
      - 'compose.low-io.yaml'
      - 'docs/NATIVE-QPKG.md'
      - '.github/workflows/native-qpkg.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and Python
        run: |
          bash -n scripts/build-native-qpkg.sh
          sh -n qpkg/shared/homehub.sh
          sh -n scripts/qnap-quiet-eval.sh
          python3 -m py_compile native/webapp.py native/migration.py native/quiet_eval.py tests/test_native_webapp.py tests/test_native_migration.py
      - name: Integration test without writing SelfCare DB
        run: python3 -m unittest discover -s tests -p 'test_native_*.py' -v
      - name: Confirm low-IO overlay is valid
        run: docker compose -f compose.yaml -f compose.low-io.yaml config --quiet
