name: Build native HomeHub QPKG preview
on:
  pull_request:
    paths:
      - '.github/workflows/build-native-qpkg.yml'
      - 'scripts/build-native-qpkg.sh'
      - 'native/**'
      - 'qpkg/**'
      - 'server/public/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-x86_64:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lightweight native tests
        run: |
          python3 -m unittest discover -s tests -p 'test_native_*.py' -v
          python3 -m py_compile native/webapp.py native/migration.py native/quiet_eval.py
          sh -n qpkg/shared/homehub.sh
          bash -n scripts/build-native-qpkg.sh
      - name: Install QDK v2.5.3 (pinned SHA-256)
        run: |
          curl --fail --location --retry 3 --output /tmp/qdk.deb https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb
          echo '17b3841b7d4590a4ee025844ba583304b5e3c497d9fa8934d5175131d3908022  /tmp/qdk.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --quiet 'Pillow==11.3.0'
      - name: Build QPKG x86_64
        run: |
          mkdir -p dist
          bash scripts/build-native-qpkg.sh x86_64 "$PWD/dist"
          test -s dist/QnapHomeHub_0.3.15_x86_64.qpkg
          sha256sum dist/*.qpkg > dist/SHA256SUMS
          ls -lh dist
      - name: Publish explicitly labeled experimental QPKG pre-release
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/native-qpkg-low-io-selfcare-bridge' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.15-qpkg-preview.1 >/dev/null 2>&1; then
            echo 'Experimental pre-release already exists; no overwrite.'
            exit 0
          fi
          gh release create v0.3.15-qpkg-preview.1 dist/QnapHomeHub_0.3.15_x86_64.qpkg dist/SHA256SUMS \
            --title 'QnapHomeHub native QPKG 0.3.15 — EXPERIMENTAL' \
            --prerelease \
            --target "${{ github.event.pull_request.head.sha }}" \
            --notes 'Experimental native Web-only x86_64 QPKG for QTS 5.x. NOT verified on NAS. Does not include native Bluetooth radio or BlueZ: existing qnaphomehub-radio Docker is still required for SwitchBot and SelfCare BLE. With radio stopped the Web UI starts in offline/quiet mode, no Bluetooth control is available. Stop the legacy qnaphomehub Web container (port 8787) before installing. Preserve existing data and do not remove SelfCare DB or Bluetooth keys. See docs/NATIVE-QPKG.md.'
      - uses: actions/upload-artifact@v4
        with:
          name: QnapHomeHub_0.3.15_x86_64_PREVIEW
          path: |
            dist/QnapHomeHub_0.3.15_x86_64.qpkg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
