name: M5GO firmware
on:
  pull_request:
    paths: ['firmware/m5go/**', 'scripts/check-m5go-*.sh', 'scripts/check-m5go-display-render.py', '.github/workflows/m5go-firmware.yml']
  push:
    branches: [main]
    paths: ['firmware/m5go/**', 'scripts/check-m5go-*.sh', 'scripts/check-m5go-display-render.py', '.github/workflows/m5go-firmware.yml']
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r firmware/m5go/requirements.txt
      - run: sh scripts/check-m5go-firmware.sh --compile
      - run: sh scripts/check-m5go-display.sh --compile
      # Intentionally no firmware artifact upload: production binaries contain secrets.
