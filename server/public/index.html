<!doctype html>
<html lang="ja" data-theme="black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>QnapHomeHub | 操作</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="controlPage">
  <div class="ambient ambientA"></div><div class="ambient ambientB"></div>
  <main>
    <header>
      <div class="brand"><div class="brandMark">QH</div><div><h1>QnapHomeHub</h1><p>DEVICE CONTROL</p></div></div>
      <div class="headerActions">
        <nav class="pageNav" aria-label="画面切替"><a class="active" href="/">操作</a><a href="/manage.html">管理</a></nav>
        <div class="themeSwitch" aria-label="テーマ"><button type="button" data-theme-choice="black">BLACK</button><button type="button" data-theme-choice="cyber">CYBER</button></div>
        <span id="health" class="pill statusPill">確認中</span>
      </div>
    </header>

    <section id="login" class="card hidden"><h2>ログイン</h2><form id="loginForm"><input id="username" type="text" value="admin" placeholder="管理ユーザー名" autocomplete="username" required /><input id="password" type="password" placeholder="管理パスワード" autocomplete="current-password" required /><button>ログイン</button></form><p id="loginError" class="error"></p></section>

    <div id="controlApp" class="hidden">
      <section class="controlHero">
        <div><div class="sectionLabel">DEVICE CONTROL</div><h2>装置操作</h2><p>登録済みデバイスをすぐ操作できます。</p></div>
        <div class="controlHeroActions"><span id="deviceCount" class="pill">0 DEVICES</span><button id="refreshControls" class="secondary">更新</button></div>
      </section>
      <section id="controlDevices" class="controlGrid empty">デバイスを読み込んでいます。</section>
    </div>
  </main>
  <script type="module" src="/control.js"></script>
</body>
</html>
